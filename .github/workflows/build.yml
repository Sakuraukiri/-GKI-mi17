name: build-xiaomi17-sukisu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
             zip unzip curl git patch build-essential bc bison flex \
            libssl-dev libelf-dev python3 rsync

      - name: Build
        env:
          WORK: ${{ github.workspace }}/work
          TC: ${{ github.workspace }}/tc
          JOBS: 4
        run: |
          set -e
          echo "pwd=$(pwd)"
          ls -la
          echo "--- locate build.sh ---"
          find . -maxdepth 3 -name build.sh -print
          echo "--- build.sh first line (check CRLF) ---"
          sed -n '1p' build.sh | cat -A
          sed -i 's/\r$//' build.sh
          bash -x build.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            work/src/build.log
            work/src/**/*.rej
          if-no-files-found: ignore

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi17-sukisu-susfs-kpm
          path: ${{ github.workspace }}/work/xiaomi17-sukisu-susfs-kpm.zip
          if-no-files-found: error
